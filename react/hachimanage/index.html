<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./hachiman-icon-32.png" />
    <link rel="apple-touch-icon" href="./hachiman-icon-180.png" />
    <meta name="theme-color" content="#F6E7D6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241E1A" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" />
    <script>
      // 八萬工作室設計系統：跟著系統切換深色主題
      if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hachimanage · HACHIMAN STUDIO 八萬工作室</title>
  </head>
  <body class="hs-page">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 检查 platform 对象是否存在，以确定是否在 Electron 环境中
      if (window.platform && window.platform.isWindows) {
        document.addEventListener('DOMContentLoaded', () => {
            const inputElements = document.getElementsByTagName('input');
            if (inputElements.length > 0) {
                inputElements[0].focus();
            }
        });
      }
      // 解决可能的 globalThis 问题
      var global = globalThis;
    </script>
  </body>
</html>
